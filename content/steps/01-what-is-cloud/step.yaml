slug: what-is-cloud
title: What cloud computing is
kicker: Cloud fundamentals
part: understand
color: sky
summary: Evaluate the economics of on-demand cloud infrastructure compared with owned hardware, and create your Google Cloud project.

parts:
  - id: a
    label: Renting instead of owning
    headline: Renting instead of owning
    body: a-renting.md
    exercise:
      title: Compare owning and renting
      intro: >
        Use the interactive cost simulator to compare fixed hardware capacity against consumption-based cloud pricing across different traffic levels and peak-to-average ratios.
      tasks:
        - kind: widget
          id: cost
          title: Evaluate workload patterns
          widget: cost-curve
          explain: >
            Adjust the average traffic and peak-to-average ratio sliders to observe how owned hardware step-functions compare with elastic cloud billing.

  - id: b
    label: Cost and trade-offs
    headline: Cost and trade-offs
    body: b-trade-offs.md
    exercise:
      title: Create a Google Cloud project
      intro: >
        All Google Cloud resources must belong to a project. Create a dedicated project for this course and verify that the Google Cloud CLI is configured to use it.
      tasks:
        - kind: placeholder
          id: diagram-billing
          title: Account, project, and billing structure
          note: diagram goes here
        - kind: project
          id: create-project
          title: Create the project
          explain: >
            Create a new project in the Google Cloud console using the suggested project ID and click "I made it", or click "Do it for me" to provision and configure the project automatically.
        - kind: terminal
          id: auth
          title: Verify the active project
          expect:
            - gcloud auth list
            - gcloud config get-value project
          explain: >
            Run `gcloud auth list` to verify the active authenticated account, then run `gcloud config get-value project` to confirm the active project ID configured for the CLI.
    checks:
      - id: signed-in
        label: Authenticated with a Google Cloud account
        probe: gcloud config get-value account
        assert: nonempty
        hint: >
          Verify your active account in the terminal using `gcloud auth list`.
      - id: project-exists
        label: The Google Cloud project exists
        probe: gcloud projects list --filter=projectId:$PROJECT_NAME* --format=value(projectId)
        assert: nonempty
        hint: >
          Create the project in the console and click "I made it", or click "Do it for me".
      - id: project-recorded
        label: The project ID is saved for subsequent steps
        probe: cat ~/project_id.txt
        assert: contains
        value: $PROJECT_NAME
        hint: >
          Click "I made it" or "Do it for me" in the project setup card to record the project ID in `~/project_id.txt`.
