slug: home
title: Deploy to Cloud Run
kicker: Serverless deployment
part: ship
color: emerald
summary: Package the application into a container image with Cloud Build, configure IAM service account permissions, and deploy a public serverless service on Cloud Run.

parts:
  - id: a
    label: Serverless containers
    headline: Serverless containers
    body: a-cloud-run.md
    exercise:
      title: Deploy the service to Cloud Run
      intro: >
        Deploy DinoQuest from source to Cloud Run, verify the public HTTPS endpoint, and confirm that the deployed container connects to Firestore and Gemini.
      tasks:
        - kind: deploy
          id: deploy-app
          title: Deploy the container
          example: Deploy DinoQuest to Cloud Run so anyone can play it
          prompt: >
            Describe how you want to deploy the application so it is publicly accessible on serverless container infrastructure.
          expect:
            goal: Deploy the app to Cloud Run.
            requires:
              - [deploy, publish, host, put, ship, launch, release, running, available, up, make, get]
              - [cloud run, cloud, online, public, internet, live, serverless]
            rejects:
              - [virtual machine, vm, compute engine, server for me]
            feedback:
              missing_0: >-
                Specify the deployment action (for example: deploy or publish
                the application).
              missing_1: >-
                Specify the target serverless runtime (for example: deploy to Cloud Run).
              rejected: >
                Virtual machines require ongoing operating system management and incur hourly charges while idle. Request a serverless Cloud Run deployment instead.
              accepted: >
                Granting IAM roles, building the container image via Cloud Build, and deploying the service to Cloud Run. Initial deployment takes two to three minutes.
          stages:
            - title: Permission
              note: IAM roles granted
              at: Granting the service account
            - title: Upload
              note: source uploaded
              at: Deploying dinoquest
            - title: Build
              note: container image built
              at: Building|Uploading
            - title: Running
              note: HTTPS URL assigned
              at: Service URL
          command: python3 scripts/deploy_app.py
          explain: >
            Expand the build log if you want to inspect the IAM policy bindings (`roles/datastore.user` and `roles/aiplatform.user`), the Cloud Build container packaging output, and the `gcloud run deploy` command.
        - kind: reflect
          id: same-app
          title: Verify the public deployment
          prompt: >
            Open the deployed `.run.app` HTTPS URL in a new browser tab. Play a round, verify that the leaderboard displays the existing scores from your Firestore database, and generate a custom dinosaur sprite.
          checklist:
            - Opened the public Cloud Run HTTPS URL
            - Confirmed leaderboard scores persist in Firestore across reloads
            - Generated a custom dinosaur sprite on the deployed service

    checks:
      - id: service-live
        label: The Cloud Run service is deployed with a public HTTPS URL
        probe: gcloud run services describe dinoquest --region=$REGION --format=value(status.url)
        assert: contains
        value: run.app
        hint: >
          Complete the "Deploy the container" task above and wait for `gcloud run deploy` to finish.
      - id: service-answers
        label: The Cloud Run service revision is healthy and ready to serve traffic
        probe: gcloud run services describe dinoquest --region=$REGION --format=value(status.conditions[0].status)
        assert: contains
        value: "True"
        hint: Wait a few seconds after deployment completes, then run the check again.
      - id: scales-to-zero
        label: The service is configured to scale down to zero instances when idle
        probe: gcloud run services describe dinoquest --region=$REGION --format=value(spec.template.metadata.annotations)
        assert: succeeds
        hint: >
          Cloud Run scales to zero by default (`min-instances=0`), ensuring you pay no compute charges when idle.
