slug: wrap-up
title: Review and cleanup
kicker: Step 8
part: run
minutes: 25
color: rose
summary: The tools that build this for you, and taking what you made back down.

parts:
  - id: a
    label: What's next
    headline: Tools that build this for you
    body: a-whats-next.md

  - id: b
    label: Cleanup
    headline: What you built, and taking it down
    body: b-cleanup.md
    exercise:
      title: Take it all down
      intro: >
        Optional. Leave the project in place if you want to keep playing with
        it — the app costs nothing while nobody is using it, and the budget
        alert from step 2 is still watching. Do this when you are finished.
      tasks:
        - kind: console
          id: delete-project
          title: Delete the project
          url: https://console.cloud.google.com/iam-admin/settings
          assist: delete-project
          explain: >
            Check the project name at the top of the console before you do
            this. Choose Shut down, type the project id to confirm, and
            everything inside it goes with it — the service, the image, the
            database. The button beside the link does the same thing, for
            anyone who would rather not.
          checklist:
            - You checked you are in the right project
            - You chose Shut down and confirmed with the project id
            - The console says the project is scheduled for deletion
        - kind: reflect
          id: what-survives
          title: Name what deleting the project did not touch
          prompt: >
            Two things you set up in step 2 are still there afterwards. Name
            them, and say why they are not inside the project.
          checklist:
            - You named your billing account
            - You can say why it belongs to you rather than to the project

    checks:
      - id: project-going
        label: The project is scheduled for deletion
        probe: gcloud projects describe $PROJECT --format=value(lifecycleState)
        assert: not_contains
        value: ACTIVE
        hint: >
          This check only passes once the project is gone. Skip it if you are
          keeping the project — nothing later depends on it.
