slug: wrap-up
title: Cost and cleanup
kicker: Operations and cleanup
part: run
color: rose
summary: Review AI-assisted Google Cloud developer workflows, analyze the billing dimensions of your architecture, and deprovision project resources.

parts:
  - id: a
    label: AI developer tools
    headline: AI developer tools
    body: a-whats-next.md

  - id: b
    label: Understanding the bill
    headline: Understanding the bill and shutting down
    body: b-cleanup.md
    exercise:
      title: Clean up project resources
      intro: >
        When you are finished testing your deployed application, shut down the Google Cloud project to delete all provisioned compute, storage, and container resources at once.
      tasks:
        - kind: console
          id: delete-project
          title: Delete the project
          url: https://console.cloud.google.com/iam-admin/settings
          assist: delete-project
          explain: >
            Open IAM & Admin Settings in the Google Cloud console, verify the active project ID, click Shut down, and enter the project ID to confirm—or click "Do it for me" to run `gcloud projects delete` automatically.
          checklist:
            - Verified the target project ID before deletion
            - Confirmed project shutdown in the console or via the workbench action
            - Confirmed the project lifecycle state changed to DELETE_REQUESTED
        - kind: reflect
          id: what-survives
          title: Verify billing account status
          prompt: >
            Identify which financial resource configured earlier in the course remains active after the project is deleted, and explain why it is unaffected by project deletion.
          checklist:
            - Identified the Cloud Billing account
            - Explained that the billing account exists outside the project boundary and can be linked to multiple projects

    checks:
      - id: project-going
        label: The project is scheduled for deletion (DELETE_REQUESTED)
        probe: gcloud projects describe $PROJECT --format=value(lifecycleState)
        assert: not_contains
        value: ACTIVE
        hint: >
          This check passes once the project lifecycle state transitions from ACTIVE to DELETE_REQUESTED. Skip this check if you choose to keep your deployment running.
