slug: your-project
title: Projects and billing
kicker: Project setup
part: corner
color: violet
summary: Understand Google Cloud project boundaries, link a Cloud Billing account, configure a budget alert, and enable required service APIs.

parts:
  - id: a
    label: Projects and billing accounts
    headline: Projects and billing accounts
    body: a-the-box.md
    exercise:
      title: Link a billing account
      intro: >
        Link your Google Cloud project to an active Cloud Billing account so you can provision managed services.
      tasks:
        - kind: billing
          id: link-billing
          title: Link a billing account
          image: /img/billing.png
          explain: >
            A Cloud Billing account is an independent financial resource linked to your project. Link your active billing account in the Google Cloud console or click "Do it for me" to link it automatically.
    checks:
      - id: billing-linked
        label: An active billing account is linked to the project
        probe: gcloud billing projects describe $PROJECT --format=value(billingEnabled)
        assert: contains
        value: "True"
        hint: >
          Click "Do it for me" above. If no open billing account is found, ensure you have redeemed your workshop credit first.

  - id: b
    label: Budget alerts
    headline: Budget alerts
    body: b-budget.md
    exercise:
      title: Configure a budget alert
      tasks:
        - kind: console
          id: set-budget
          title: Configure a budget alert
          url: https://console.cloud.google.com/billing/budgets
          assist: budget
          explain: >
            Create a monthly budget alert on your billing account scoped to your project. Set a low threshold (such as $5 or $10) so notifications trigger early despite batched billing updates.
          checklist:
            - The budget is scoped to your active project
            - The target amount is set to a low threshold ($5 or $10)
            - Default threshold rules (50%, 90%, 100%) are enabled
            - Email notifications are enabled
    checks:
      - id: budget-set
        label: A budget alert is configured on the billing account
        probe: python3 scripts/probe_budget.py
        assert: matches
        value: BUDGETS=[1-9]
        hint: >
          Create a budget in the Cloud Billing console or click "Do it for me" in the task card above.

  - id: c
    label: Enabling services
    headline: Enabling services
    body: c-switches.md
    exercise:
      title: Enable required APIs
      intro: >
        Enable the Google Cloud APIs required to build, store, and deploy DinoQuest, then verify the enabled services from the command line.
      tasks:
        - kind: console
          id: enable-console
          title: Enable APIs in the console
          url: https://console.cloud.google.com/apis/library
          assist: services
          explain: >
            Enable each service below in the Google Cloud API Library, or click "Do it for me" to enable all required APIs on your project using `gcloud services enable`.
          checklist:
            - "Cloud Run API (run.googleapis.com)"
            - "Cloud Build API (cloudbuild.googleapis.com)"
            - "Artifact Registry API (artifactregistry.googleapis.com)"
            - "Cloud Firestore API (firestore.googleapis.com)"
            - "Vertex AI / Gemini Enterprise Agent Platform API (aiplatform.googleapis.com)"
        - kind: terminal
          id: list-services
          title: List enabled services
          expect:
            - gcloud services list --enabled --format=value(config.name)
          explain: >
            Run `gcloud services list --enabled --format=value(config.name)` in the terminal to verify all enabled APIs on your active project.
    checks:
      - id: run-enabled
        label: Cloud Run API is enabled
        probe: gcloud services list --enabled --filter=run.googleapis.com --format=value(config.name)
        assert: contains
        value: run.googleapis.com
        hint: Enable the required APIs in the task above.
      - id: build-enabled
        label: Cloud Build and Artifact Registry APIs are enabled
        probe: gcloud services list --enabled "--filter=cloudbuild.googleapis.com OR artifactregistry.googleapis.com" --format=value(config.name)
        assert: contains
        value: artifactregistry.googleapis.com
        hint: Cloud Build and Artifact Registry are required to build and store your container image.
      - id: firestore-enabled
        label: Cloud Firestore API is enabled
        probe: gcloud services list --enabled --filter=firestore.googleapis.com --format=value(config.name)
        assert: contains
        value: firestore.googleapis.com
        hint: Enable the Cloud Firestore API (`firestore.googleapis.com`).
      - id: ai-enabled
        label: Vertex AI API (aiplatform.googleapis.com) is enabled
        probe: gcloud services list --enabled --filter=aiplatform.googleapis.com --format=value(config.name)
        assert: contains
        value: aiplatform.googleapis.com
        hint: Enable `aiplatform.googleapis.com` to allow Gemini API calls.
