slug: your-app
title: Run the application locally
kicker: Cloud fundamentals
part: understand
color: sky
summary: Inspect the local application architecture, start the Python HTTP server, and evaluate why a local terminal process cannot serve external users.

parts:
  - id: a
    label: The application
    headline: The application
    body: a-the-app.md
    exercise:
      title: Run the application
      intro: >
        Inspect the application source files, start the local HTTP server from the terminal, and test the game in the preview panel.
      tasks:
        - kind: files
          id: look
          title: Inspect the code
          start: app
          open: app/main.py
          explain: >
            Review the project files in the explorer. `app/main.py` contains the HTTP server and the in-memory leaderboard implementation (`SCORES`). You can also inspect `app/requirements.txt`, `app/Procfile`, and `app/static/`.
        - kind: terminal
          id: start
          title: Start the local server
          expect:
            - cd app
            - python3 main.py
          explain: >
            Change into the `app` directory and start the Python server by running `cd app` followed by `python3 main.py`.
        - kind: app
          id: play
          title: Play DinoQuest
          appTitle: DinoQuest
          explain: >
            When the server starts on port 8080, the live application loads below. Press Space or click to jump, enter a player name, and record a score on the leaderboard.
    checks:
      - id: app-answers
        label: The local server is running and responding on port 8080
        probe: curl -s -o /dev/null -w %{http_code} http://127.0.0.1:8080/api/health
        assert: contains
        value: "200"
        hint: Start `python3 main.py` in the terminal panel above.
    after:
      action: stop-app
      label: Stop the app
      note: >
        Stop the local server process when you finish testing to release port 8080.

  - id: b
    label: Requirements for a public app
    headline: Requirements for a public app
    body: b-requirements.md
    checks:
      - id: gcloud-present
        label: The Google Cloud CLI is installed and available
        probe: gcloud version
        assert: contains
        value: Google Cloud SDK
        hint: >
          Cloud Shell includes the Google Cloud CLI by default. If you are running locally, install the Google Cloud SDK before continuing.
