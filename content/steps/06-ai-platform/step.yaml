slug: ai-platform
title: Generate sprites with Gemini
kicker: Managed services
part: grow
color: fuchsia
summary: Configure the Google Gen AI SDK with Application Default Credentials and use Gemini structured outputs to generate custom game sprites.

parts:
  - id: a
    label: Hosted models and Model Garden
    headline: Hosted models and Model Garden
    body: a-platform.md
  - id: b
    label: Generating sprites with Gemini
    headline: Generating sprites with Gemini
    body: b-generate.md
    exercise:
      title: Integrate Gemini sprite generation
      intro: >
        Configure the runtime environment variables for the Google Gen AI SDK, update the sprite generation module in `app/main.py`, and generate a custom dinosaur sprite.
      tasks:
        - kind: intent
          id: settings
          title: Configure the Gen AI SDK
          example: Set up what the app needs to call Gemini
          prompt: >
            Describe the environment configuration and SDK installation required so the application can authenticate and call Gemini on Google Cloud.
          expect:
            goal: Write app/.env and install the Gen AI SDK.
            requires:
              - [gemini, model, vertex, ai, agent platform, llm]
              - [set up, setup, configure, connect, prepare, settings, environment, env, ready, install, add]
            rejects:
              - [api key, key, token, secret]
            feedback:
              missing_0: Specify the AI service or model the application needs to call (for example, Gemini).
              missing_1: >-
                Specify the configuration action required (for example: configure the environment settings for Gemini).
              rejected: >
                Static API keys are not used when calling Gemini through Google Cloud IAM. The Google Gen AI SDK authenticates automatically using Application Default Credentials.
              accepted: >
                Writing `app/.env` and installing the `google-genai` SDK. Review the environment variables written by the setup script.
          stages:
            - title: Settings
              note: written to app/.env
              at: wrote app/\.env
            - title: Endpoint
              note: global routing
              at: GOOGLE_CLOUD_LOCATION
            - title: The SDK
              note: google-genai
              at: installed
            - title: Ready
              note: configuration complete
              at: reads this file
          command: python3 scripts/setup_gemini_env.py
          explain: >
            This step writes `GOOGLE_GENAI_USE_VERTEXAI`, `GOOGLE_CLOUD_PROJECT`, `GOOGLE_CLOUD_LOCATION=global`, and `DINO_MODEL` to `app/.env` and installs `google-genai`.
        - kind: files
          id: connect-gemini
          title: Implement structured sprite generation
          example: Change the code so Gemini draws a new dino when I ask
          start: app
          open: app/main.py
          expect:
            goal: Change app/main.py so Gemini draws the dino.
            requires:
              - [dino, sprite, character, picture, image]
              - [generate, draw, create, make, new, change, add, wire, connect]
            rejects:
              - [download, stock, clip art, upload]
            feedback:
              missing_0: Specify what the model should generate (the dinosaur sprite or character).
              missing_1: >-
                Specify the action required (for example: update the code to generate a new dino sprite on request).
              rejected: >
                Rather than downloading a static file, the application calls Gemini to generate a custom pixel-art grid dynamically.
              accepted: >
                Updating the `dino` section of `app/main.py` with `genai.Client()` and structured JSON output parsing. Inspect the diff in the file explorer.
          command: python3 scripts/connect_gemini.py
          explain: >
            This update replaces the `# ── the dino ── begin dino ──` section in `app/main.py` with `make_dino()`, structured schema validation (`SHAPE`), and PNG encoding while leaving the rest of the application unchanged.
        - kind: app
          id: generate
          title: Test custom sprite generation
          appTitle: DinoQuest
          explain: >
            Start (or restart) the local server. Enter a prompt in the "Draw me a new dino" input field, click Generate, and play a round with the newly generated sprite.
    checks:
      - id: ai-enabled
        label: Vertex AI API (aiplatform.googleapis.com) is enabled
        probe: gcloud services list --enabled --filter=aiplatform.googleapis.com --format=value(config.name)
        assert: contains
        value: aiplatform.googleapis.com
        hint: >
          Ensure `aiplatform.googleapis.com` is enabled on your project.
      - id: sdk-installed
        label: The google-genai SDK is listed in app/requirements.txt
        probe: cat app/requirements.txt
        assert: contains
        value: google-genai
        hint: Complete the "Configure the Gen AI SDK" task above.
      - id: app-calls-gemini
        label: The application initializes genai.Client() in app/main.py
        probe: cat app/main.py
        assert: contains
        value: genai.Client(
        hint: Complete the "Implement structured sprite generation" task above.
      - id: app-reports-dino
        label: The running server reports Gemini sprite generation is active
        probe: curl -s http://127.0.0.1:8080/api/health
        assert: contains
        value: '"dino": true'
        hint: >
          Restart the local server in the DinoQuest preview panel so `app/main.py` loads the updated Gemini integration.
    after:
      action: stop-app
      label: Stop the app
      note: Stop the local server before deploying the containerized service to Cloud Run.
