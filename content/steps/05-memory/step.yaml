slug: memory
title: Persist data with Firestore
kicker: Managed services
part: grow
color: fuchsia
summary: Provision a regional Firestore database and update the application to persist leaderboard scores across server restarts.

parts:
  - id: a
    label: Managed databases and Firestore
    headline: Managed databases and Firestore
    body: a-databases.md
    exercise:
      title: Configure Firestore persistence
      intro: >
        Complete the tasks below to observe how in-memory state is lost on restart, provision a regional Firestore database, and update the application storage layer.
      tasks:
        - kind: app
          id: lose-it
          title: Observe in-memory state reset
          appTitle: DinoQuest
          explain: >
            Start the local server, play a round to record a score on the leaderboard, and then click Stop followed by Start. Notice that the leaderboard resets to empty because `SCORES` is stored in process memory.
        - kind: provision
          id: create-db
          title: Create the Firestore database
          url: https://console.cloud.google.com/firestore/databases?cloudshell=true
          linkLabel: Open Firestore in the console
          example: Set up a Firestore database in my region to keep the scores
          prompt: >
            Describe the managed database resource you need to provision so leaderboard scores persist when the server stops.
          expect:
            goal: Create a Firestore database in the student's region.
            requires:
              - [database, firestore, datastore, records, storage, persist]
              - [create, make, set up, need, want, add, new, give]
            rejects:
              - [bucket, file storage, object storage]
            feedback:
              missing_0: >
                Specify the type of storage resource required to hold structured leaderboard records (for example, a Firestore database).
              missing_1: "Specify the action to take (for example: create or set up the database)."
              rejected: >
                Cloud Storage buckets store unstructured files as opaque blobs. Because leaderboard entries are structured records that must be queried and sorted, request a Firestore database instead.
              accepted: >
                Provisioning a Firestore database in your configured region (`gcloud firestore databases create`). This operation takes approximately one minute.
          command: bash scripts/create_database.sh
        - kind: files
          id: connect
          title: Update the storage code
          example: Change the app to save scores in Firestore instead of the list
          start: app
          open: app/main.py
          expect:
            goal: Change app/main.py to use Firestore instead of the in-memory list.
            requires:
              - [firestore, database, db]
              - [use, connect, write, save, store, point, switch, change, instead]
            feedback:
              missing_0: Specify the target database service the application should use (Firestore).
              missing_1: >-
                Specify the code update required (for example: update the app to store scores in Firestore).
              accepted: >
                Updating the `store` section of `app/main.py` to use `firestore.Client()` and installing `google-cloud-firestore`. Inspect the highlighted changes in the file viewer.
          command: python3 scripts/connect_firestore.py
          explain: >
            Now that the Firestore database exists, update `app/main.py` so `add_score()` and `leaderboard()` read and write documents in the `scores` collection rather than the in-memory Python list.
        - kind: reflect
          id: keep-it
          title: Verify score persistence
          linkTo: lose-it
          linkLabel: Return to the DinoQuest preview panel above
          prompt: >
            Return to the DinoQuest preview panel, restart the server, record a score, and then click Stop and Start again. Verify that your leaderboard score persists across the restart.
          checklist:
            - Recorded a score on the leaderboard
            - Stopped and restarted the Python server process
            - Confirmed the score remained on the leaderboard after restart
    checks:
      - id: firestore-db
        label: A Firestore database is provisioned in the project
        probe: gcloud firestore databases list --format=value(name)
        assert: nonempty
        hint: >
          Complete the "Create the Firestore database" task above.
      - id: db-region
        label: The Firestore database is deployed in a configured region
        probe: gcloud firestore databases list --format=value(locationId)
        assert: nonempty
        hint: Verify that `gcloud firestore databases list` returns a valid `locationId`.
      - id: app-uses-firestore
        label: The application storage layer uses the Firestore client library
        probe: cat app/main.py
        assert: contains
        value: firestore.Client()
        hint: Complete the "Update the storage code" task above.
      - id: app-reports-firestore
        label: The running server reports Firestore as its active storage backend
        probe: curl -s http://127.0.0.1:8080/api/health
        assert: contains
        value: in Firestore
        hint: >
          Restart the local server in the DinoQuest panel so `app/main.py` loads the updated Firestore code.
    after:
      action: stop-app
      label: Stop the app
      note: Stop the local server process before proceeding to the next section.
